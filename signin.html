<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Study Buddy Café</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/layout.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-cat" data-cat="miso" data-scale="2"></span><span>Study Buddy</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html#features">Features</a>
      <a href="index.html#cats">Cats</a>
      <a href="signup.html">Sign up</a>
    </nav>
    <button id="themeToggle" class="btn btn-small" type="button" aria-label="Toggle light and dark theme">☾ Dark</button>
  </header>

  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="auth-cat" data-cat="latte" data-scale="5"></div>
      <h1>Welcome back</h1>
      <p class="sub">Your cat saved you a seat by the window.</p>
      <div id="formAlert" class="alert alert-error" role="alert" hidden></div>

      <form id="signinForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password">
            <button type="button" id="togglePw" class="eye" aria-label="Show password" aria-pressed="false">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-block">Sign in</button>
        <button type="button" id="guestBtn" class="btn btn-alt btn-block">Continue as guest</button>
      </form>
      <p class="auth-links">New here? <a href="signup.html">Create an account</a> · <a href="register.html">Full registration</a></p>
    </section>
  </main>

  <script src="js/cats.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
